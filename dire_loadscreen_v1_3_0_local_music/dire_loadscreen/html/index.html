<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dire County RP</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main id="stage" aria-label="Dire County loading screen">
        <!--
            This artboard deliberately uses the exact source artwork aspect ratio.
            Every animated layer is attached to it, so the wolf eyes remain aligned
            even on ultrawide or non-16:9 displays.
        -->
        <section id="artboard">
            <img id="background" src="images/dire_background.png" alt="" draggable="false" />

            <!-- Very slow, near-invisible drifting fog/cloud layer. Keeps the sky
                 from ever looking perfectly frozen, independent of lightning. -->
            <div id="cloudLayer" aria-hidden="true"></div>

            <!-- Faint constant motion inside the locomotive's existing smoke plume. -->
            <div id="smokeLayer" aria-hidden="true"></div>

            <div id="stormGlow" aria-hidden="true"></div>

            <svg id="lightningSvg" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                    <filter id="boltGlow" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <path id="boltGlowPath" class="bolt bolt-glow" d="" />
                <path id="boltCorePath" class="bolt bolt-core" d="" />
                <path id="branchGlowPath" class="bolt bolt-glow branch" d="" />
                <path id="branchCorePath" class="bolt bolt-core branch" d="" />
            </svg>

            <img id="redEyes" src="images/dire_eyes_red.png" alt="" draggable="false" aria-hidden="true" />

            <div id="vignette" aria-hidden="true"></div>
        </section>

        <!-- Local loading music. Keeping the audio element in the page makes
             RedM/CEF playback independent of YouTube embeds. -->
        <audio id="loadingMusic" preload="auto" playsinline></audio>

        <section id="musicControls" aria-label="Loading screen music controls">
            <button id="musicToggle" type="button" aria-label="Play or pause loading music" title="Play / pause music">
                <span id="musicToggleIcon" aria-hidden="true">♪</span>
            </button>
            <div id="musicVolumeWrap">
                <label id="musicVolumeLabel" for="musicVolume">MUSIC</label>
                <input id="musicVolume" type="range" min="0" max="100" step="1" value="28" aria-label="Loading screen music volume" />
                <output id="musicVolumeValue" for="musicVolume">28%</output>
            </div>
            <span id="musicStatus" class="sr-only" aria-live="polite"></span>
        </section>

        <!-- Loading bar + rotating tips. Sits pinned to the viewport (not the
             artboard) so it stays put and legible at any aspect ratio. -->
        <section id="hud" aria-hidden="true">
            <div id="loadingBarWrap">
                <div id="loadingBarTrack">
                    <div id="loadingBarFill"></div>
                    <div id="loadingBarSheen"></div>
                </div>
            </div>
            <div id="tipWrap">
                <span id="tipText"></span>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
